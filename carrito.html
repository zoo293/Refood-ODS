<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito — REFOOD PERÚ</title>
  <meta name="theme-color" content="#1a9e5c">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .user-dropdown{position:absolute;right:0;top:calc(100% + .5rem);background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);min-width:190px;z-index:100;overflow:hidden;}
    .user-dropdown a{display:block;padding:.7rem 1rem;font-size:.9rem;color:var(--text-main);transition:var(--transition);}
    .user-dropdown a:hover{background:var(--primary-light);color:var(--primary);}
    .user-dropdown hr{border:none;border-top:1px solid var(--border);}
    #nav-auth-zone{position:relative;display:flex;align-items:center;gap:.6rem;}
  </style>
</head>
<body>

<div class="cart-page">
  <div class="page-title-wrap">
    <h1 class="page-title">🛒 Mi Carrito</h1>
    <p class="page-subtitle">Revisa tus productos y confirma tu reserva</p>
  </div>

  <div class="cart-layout" style="max-width:1100px;margin:0 auto;">
    <!-- Items -->
    <div id="cart-wrapper">
      <!-- Rendered by carrito.js -->
    </div>

    <!-- Summary -->
    <div id="cart-summary" class="cart-summary" style="display:none;">
      <!-- Rendered by carrito.js -->
    </div>
  </div>
</div>

<!-- Modal confirmación -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">✅ Confirmar reserva</h3>
      <button class="modal-close" onclick="closeModal('confirm-modal')">✕</button>
    </div>
    <div style="text-align:center;padding:1rem 0;">
      <div style="font-size:3rem;margin-bottom:1rem;">🎉</div>
      <p style="color:var(--text-muted);line-height:1.7;margin-bottom:1.5rem;">
        Al confirmar, recibirás un <strong>código de reserva</strong>. Tienes <strong>2 horas</strong> para recoger tus productos en el local correspondiente.
      </p>
      <div style="background:var(--primary-light);border-radius:var(--radius-sm);padding:.9rem;margin-bottom:1.5rem;font-size:.88rem;color:var(--primary-dark);">
        🌱 Con esta reserva reduces el desperdicio y cuidas el planeta
      </div>
      <div style="display:flex;gap:.8rem;">
        <button class="btn btn-secondary btn-full" onclick="closeModal('confirm-modal')">Cancelar</button>
        <button class="btn btn-primary btn-full" id="btn-confirm-reservation">Confirmar reserva →</button>
      </div>
    </div>
  </div>
</div>

<script src="js/navbar.js"></script>
<script src="js/app.js"></script>
<script src="js/carrito.js"></script>
<script src="js/extras.js"></script>
</body>
</html>
